services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: health_copilot
      MYSQL_USER: health
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.19.1
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
    volumes: [qdrant-data:/qdrant/storage]
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: base
    environment: &backend-env
      DATABASE_URL: mysql+pymysql://health:${MYSQL_PASSWORD}@mysql:3306/health_copilot
      STORAGE_DIR: /data/storage
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_BASE_URL: https://api.sarvam.ai
      SUMMARY_MODEL: sarvam-105b
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      LAYA_API_KEY: ${LAYA_API_KEY:-}
      LAYA_BASE_URL: ${LAYA_BASE_URL:-https://laya-model.com}
      LAYA_MODEL: ${LAYA_MODEL:-multilingual}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes: [documents:/data/storage]
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: base
    command: [python, -m, app.worker]
    environment: *backend-env
    volumes: [documents:/data/storage]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: [127.0.0.1:8080:80]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
volumes:
  mysql-data:
  documents:
  qdrant-data:
